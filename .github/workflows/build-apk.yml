name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js features.js folgas.js folha-ponto.js holerite-refinado.js status-dia.js marcacao-unica.js manifest.json sw.js icon.svg www/
          if [ -f descontos-auto.js ]; then cp descontos-auto.js www/; fi
          if [ -f backup-fix.js ]; then cp backup-fix.js www/; fi

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.juliocarvalho.pontofloat",
            "appName": "Ponto App Pessoal",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          JSON
          npx cap add android
          npx cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/App-Ponto-Pessoal-debug-floating.apk
          sha256sum dist/App-Ponto-Pessoal-debug-floating.apk > dist/App-Ponto-Pessoal-debug-floating.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ponto-pessoal-debug-floating
          path: dist/*
